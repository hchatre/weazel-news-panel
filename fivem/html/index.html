<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src https:; frame-src https: http:;">
    <title>Weazel News</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<div id="tablet" class="tablet" hidden>
  <div class="tablet-bezel">
    <span class="tablet-camera" aria-hidden="true"></span>
    <div class="tablet-screen">
      <div id="lock" class="lock" role="button" tabindex="0" aria-label="Unlock and open Weazel News">
        <div class="lock-band" aria-hidden="true"></div>
        <div class="lock-brand"><img src="icon.png" alt=""><span>Weazel News</span></div>
        <div class="lock-clock"><div id="lockDay" class="lock-day"></div><div id="lockTime" class="lock-time">--:--</div></div>
        <div id="lockMsg" class="lock-msg" role="status" aria-live="polite"></div>
        <div class="lock-hint"><span class="lock-chevron" aria-hidden="true"></span><span id="lockHint">Click to open</span></div>
      </div>
      <iframe id="webFrame" class="web-frame" title="Weazel Newsroom" hidden allow="clipboard-read; clipboard-write"></iframe>
      <button id="homeBar" class="home-bar" aria-label="Lock the tablet"></button>
    </div>
  </div>
</div>
</body>
</html>
